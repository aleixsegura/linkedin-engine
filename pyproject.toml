[project]
name = "engine"
version = "0.1.0"
description = "Motor de búsqueda de ofertas geoespaciales en LinkedIn con histórico de skills"
authors = [
    { name = "Aleix Segura", email = "aleixsegura29@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langdetect>=1.0.9",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.2",
    "typer>=0.27.3",
]

[project.scripts]
engine = "engine.cli:app"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
